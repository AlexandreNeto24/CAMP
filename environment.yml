# Single install file for CAMP, on Windows, Linux, and macOS:
#   conda env create -f environment.yml
# Conda keeps the PyTorch line that matches the machine.
# Windows and 64-bit Linux get the CUDA 12.4 build.
# macOS and Linux ARM get the build published for that platform.
name: CAMP
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124  # [linux64 or win64]
      - torch==2.4.1+cu124  # [linux64 or win64]
      - torchvision==0.19.1+cu124  # [linux64 or win64]
      - torch==2.4.1  # [arm64 or aarch64]
      - torchvision==0.19.1  # [arm64 or aarch64]
      - torch==2.2.2  # [osx64]
      - torchvision==0.17.2  # [osx64]
      - segmentation-models-pytorch==0.5.0
      - timm==1.0.19
      - albumentations==1.3.1
      - numpy>=1.23,<2
      - scipy>=1.8,<1.14
      - scikit-image>=0.20,<0.22
      - opencv-python-headless>=4.8,<4.10
      - pillow>=9
      - pyyaml>=6
      - matplotlib>=3.5
      - tqdm>=4.64
