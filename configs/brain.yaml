# Example run for the brain tutorial. The notebook repeats these numbers.
# The paper defaults stay in configs/default.yaml.
#
#   python -m camp train segmentor --config configs/brain.yaml
#   python -m camp train recommender --config configs/brain.yaml
#   python -m camp generate --config configs/brain.yaml

common:
  class_name: brain
  data_dir: data
  device: cuda
  encoder: efficientnet-b3

segmentor:
  decoder_dropout: 0.4
  image_size: 512
  patch_size: 128
  epochs: 40
  batch_size: 8
  lr: 3.0e-4
  freeze_epochs: 15
  finetune_lr: 1.0e-4
  accumulation_steps: 2
  patience: 25
  split_ratio: 0.2
  output: null
  debug: true

recommender:
  embedding_dim: 2048
  num_heads: 16
  dropout: 0.10
  segmentor_weights: null
  epochs: 30
  lr: 3.0e-4
  batch_size: 4
  accumulation_steps: 4
  patience: 30
  finetune_epochs: 10
  finetune_lr: 5.0e-5
  image_size: 512
  patch_size: 128
  split_ratio: 0.2
  output: null
  debug: true

generate:
  num: 4
  output: null
  target_dir: null
  source_dir: null
  use_tto: true
  seed: 42
  max_source: 50
  debug: true
