# CLI defaults for CAMP. Edit this file (or pass --config PATH) instead of
# long command lines. Flags on the CLI always win over values here.
#
# Precedence: CLI flag > this file > built-in fallback.
# Set common.class_name once, then:
#   python -m camp train segmentor
#   python -m camp train recommender
#   python -m camp generate

common:
  class_name: null          # e.g. apple — or pass --class on the CLI
  data_dir: data
  device: cuda
  encoder: efficientnet-b3

segmentor:
  decoder_dropout: 0.4
  image_size: 512
  patch_size: 128
  epochs: 80
  batch_size: 8
  lr: 3.0e-4
  freeze_epochs: 30
  finetune_lr: 1.0e-4
  accumulation_steps: 2
  patience: 25
  split_ratio: 0.2
  output: null              # default: weights/<class>/segmentor/
  debug: false

recommender:
  embedding_dim: 2048
  num_heads: 16
  dropout: 0.10
  segmentor_weights: null   # default: auto-detect under weights/<class>/segmentor/
  epochs: 60
  lr: 3.0e-4
  batch_size: 4
  accumulation_steps: 4
  patience: 30
  finetune_epochs: 20
  finetune_lr: 5.0e-5
  image_size: 512
  patch_size: 128
  split_ratio: 0.2
  output: null              # default: weights/<class>/recommender/
  debug: false

generate:
  num: 10
  output: null              # default: data/augmented/<class>/
  target_dir: null
  source_dir: null
  use_tto: true             # false is the same as passing --no-tto
  seed: null
  max_source: 50
  debug: false
