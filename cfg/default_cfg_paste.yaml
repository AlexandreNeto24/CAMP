# models config
# This file contains the configuration for different YOLOv8 models
# Each model has its own section with specific parameters

# Model: yolov8n
yolov8n:
  model_name: "yolov8n"
  model_weights: "{model_name}.pt"
  hyp_path: "cfg/default.yaml"
  device: "cuda"

  training:
    epochs: 50
    batch_size: 16
    learning_rate: 0.001
    img_size: 640
    earlystop_patience: 10
    unfreeze_patience: 10
    reduce_lr_patience: 5
    reduce_lr_factor: 0.1

  logging:
    log_dir: "logs/{model_name}"
    save_checkpoint: true
    checkpoint_path: "models/paste/weights/{model_name}/"

# Model: yolov8s
yolov8s:
  model_name: "yolov8s"
  model_weights: "{model_name}.pt"
  hyp_path: "cfg/default.yaml"
  device: "cuda"

  training:
    epochs: 50
    batch_size: 8
    learning_rate: 0.001
    img_size: 640
    earlystop_patience: 10
    unfreeze_patience: 10
    reduce_lr_patience: 5
    reduce_lr_factor: 0.1

  logging:
    log_dir: "logs/{model_name}"
    checkpoint_path: "models/paste/weights/{model_name}/"